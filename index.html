<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meu Treino da Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --card: #1e1e1e;
    --card-hover: #252525;
    --border: #2a2a2a;
    --accent: #ff6b35;
    --accent2: #ff8c5a;
    --accent-dim: rgba(255,107,53,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.15);
    --text: #f5f5f5;
    --text2: #a0a0a0;
    --text3: #666;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══════════════════════════════════════════
     🛠️ CORREÇÃO iPHONE #1: Micro-animação que
     FORÇA o Safari a repintar o GIF sem parar
     ═══════════════════════════════════════════ */
  @-webkit-keyframes ios-gif-fix {
    0%   { opacity: 0.999; }
    50%  { opacity: 1; }
    100% { opacity: 0.999; }
  }
  @keyframes ios-gif-fix {
    0%   { opacity: 0.999; }
    50%  { opacity: 1; }
    100% { opacity: 0.999; }
  }

  /* ═══════════════════════════════════════════
     🛠️ CORREÇÃO iPHONE #2: GPU forçada em
     TODOS os elementos de mídia
     ═══════════════════════════════════════════ */
  .media-image, .media-embed, .media-embed iframe, .media-embed video {
    -webkit-transform: translate3d(0,0,0) !important;
    transform: translate3d(0,0,0) !important;
    -webkit-backface-visibility: hidden !important;
    backface-visibility: hidden !important;
    -webkit-perspective: 1000px !important;
    perspective: 1000px !important;
  }

  .media-image {
    -webkit-animation: ios-gif-fix 0.5s linear infinite !important;
    animation: ios-gif-fix 0.5s linear infinite !important;
    will-change: opacity;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 16px 100px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 32px;
    -webkit-animation: fadeUp 0.6s ease both;
    animation: fadeUp 0.6s ease both;
  }

  @-webkit-keyframes fadeUp {
    from { opacity: 0; -webkit-transform: translateY(20px); transform: translateY(20px); }
    to   { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header .fire { font-size: 40px; display: block; margin-bottom: 8px; }

  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    color: var(--text2);
    font-size: 14px;
    margin-top: 6px;
  }

  /* ── Save Status ── */
  .save-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--green);
    flex-wrap: wrap;
  }

  .save-bar .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .save-bar .dot.saving {
    background: var(--accent);
    -webkit-animation: blink 0.6s ease infinite;
    animation: blink 0.6s ease infinite;
  }

  @-webkit-keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .save-bar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .save-bar button:active { background: var(--accent-dim); color: var(--accent); }
  .save-bar .spacer { flex: 1; }

  /* ── Day Cards (Home) ── */
  .day-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .day-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    width: 100%;
    color: var(--text);
    font: inherit;
    text-align: left;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .day-card:active {
    background: var(--card-hover);
    border-color: var(--accent);
    -webkit-transform: scale(0.98);
    transform: scale(0.98);
  }

  .day-badge {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #e05520);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(255,107,53,0.3);
  }

  .day-info { flex: 1; min-width: 0; }
  .day-info .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
  }
  .day-info .group {
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-info .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
  }

  .day-arrow {
    color: var(--text3);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ── Progress Bar ── */
  .progress-wrap {
    margin: 16px 0 20px;
  }
  .progress-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    height: 6px;
    background: var(--bg2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #ffd700);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ── Back Button ── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .day-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .group-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .group-label { font-size: 14px; color: var(--text2); }
  .group-input {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 6px 10px;
    border-radius: 8px;
    width: 200px;
  }
  .icon-btn {
    background: none; border: none;
    color: var(--text3); cursor: pointer;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    padding: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active { color: var(--accent); }

  /* ── Exercise List ── */
  .ex-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .ex-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    transition: all 0.2s ease;
  }
  .ex-row.done {
    opacity: 0.5;
    border-color: var(--green);
    background: var(--green-dim);
  }

  .ex-check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--text3);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    font-size: 13px;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s ease;
  }
  .ex-check.checked {
    border-color: var(--green);
    background: var(--green);
    color: #000;
  }

  .ex-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    min-width: 0;
  }
  .ex-row.done .ex-name { text-decoration: line-through; color: var(--text2); }

  .ex-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent2);
    background: var(--accent-dim);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .ex-meta.empty {
    color: var(--text3);
    background: var(--bg2);
    font-style: italic;
  }

  .ex-play {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: none;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 10px;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s ease;
  }
  .ex-play:active, .ex-play.active {
    background: var(--accent);
    color: #fff;
  }

  .ex-del {
    background: none; border: none;
    color: var(--text3);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .ex-del:active { color: #ef4444; }

  /* ── Video/GIF Panel ── */
  .vid-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-top: -4px;
    margin-bottom: 4px;
    -webkit-animation: fadeUp 0.3s ease both;
    animation: fadeUp 0.3s ease both;
  }

  .vid-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .vid-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
  }
  .vid-close {
    background: none; border: none;
    color: var(--text3);
    font-size: 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    -webkit-tap-highlight-color: transparent;
  }
  .vid-close:active { color: var(--accent); }

  .media-embed {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
  }
  .media-embed iframe, .media-embed video {
    width: 100%; height: 100%;
    border: 0; display: block;
  }

  .media-image {
    width: 100%;
    max-height: 340px;
    object-fit: contain;
    border-radius: 8px;
    background: #000;
    display: block;
  }

  .media-link {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  /* ── Edit Mode ── */
  .ex-row.editing {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .edit-fields {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .edit-input {
    flex: 1; min-width: 55px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px;
    border-radius: 8px;
  }
  .edit-input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .edit-video-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 8px;
    border-radius: 8px;
  }
  .edit-video-input:focus { outline: 1px solid var(--accent); }
  .edit-save {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    align-self: flex-end;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-save:active { background: #e05520; }
  .edit-hint {
    font-size: 10px;
    color: var(--text3);
    line-height: 1.4;
  }
  .edit-file label {
    font-size: 11px;
    color: var(--text2);
    display: block;
    margin-bottom: 4px;
  }
  .edit-file input[type="file"] {
    font-size: 11px;
    color: var(--text2);
    max-width: 100%;
  }
  .local-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--green);
    margin-top: 4px;
  }
  .local-remove {
    background: none; border: none;
    color: var(--text3);
    font-size: 10px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ── Add Form ── */
  .add-form {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .add-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 12px;
  }
  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .form-row input {
    flex: 1;
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .form-row input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .form-row input::placeholder { color: var(--text3); }
  .form-row.small input { font-size: 13px; padding: 8px 10px; }

  .add-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #e05520);
    color: #fff;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 4px;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 16px rgba(255,107,53,0.3);
  }
  .add-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); }

  .reset-btn {
    display: block;
    margin: 24px auto 0;
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reset-btn:active { border-color: #ef4444; color: #ef4444; }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    color: var(--text3);
    font-size: 14px;
    margin-bottom: 16px;
  }

  [hidden] { display: none !important; }

  @media (max-width: 400px) {
    .ex-row { flex-wrap: wrap; gap: 8px; }
    .ex-name { flex-basis: calc(100% - 80px); order: 1; }
    .ex-check { order: 0; }
    .ex-play { order: 2; }
    .ex-meta { order: 3; flex-basis: 100%; text-align: center; }
    .ex-del { order: 4; margin-left: auto; }
    .edit-fields { flex-direction: column; }
    .edit-input { min-width: 100%; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ═══ HOME ═══ -->
  <main id="home-view">
    <div class="header">
      <span class="fire">🔥</span>
      <h1>MEU TREINO<br>DA SEMANA</h1>
      <p>Escolha um dia para treinar 💪</p>
    </div>

    <div class="save-bar" id="save-bar">
      <span class="dot" id="save-dot"></span>
      <span id="save-text">Dados salvos</span>
      <span class="spacer"></span>
      <button id="backup-btn">📥 Backup</button>
      <button id="restore-btn">📤 Restaurar</button>
    </div>

    <div class="day-grid" id="day-grid"></div>
    <button class="reset-btn" id="reset-btn">↺ restaurar treino padrão</button>
  </main>

  <!-- ═══ DAY VIEW ═══ -->
  <main id="day-view" hidden>
    <button class="back-btn" id="back-btn">← Voltar</button>
    <h1 class="day-title" id="day-title">Segunda</h1>
    <div class="group-row">
      <span class="group-label" id="group-display"></span>
      <input class="group-input" id="group-input" hidden>
      <button class="icon-btn" id="group-edit-btn">✏️ editar</button>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">0 / 0</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="ex-list" id="ex-list"></div>

    <form class="add-form" id="add-form">
      <p class="add-title">＋ Adicionar exercício</p>
      <div class="form-row">
        <input type="text" id="inp-name" placeholder="Nome do exercício" required>
      </div>
      <div class="form-row small">
        <input type="text" id="inp-sets" placeholder="Séries (3)">
        <input type="text" id="inp-reps" placeholder="Reps (12)">
        <input type="text" id="inp-weight" placeholder="Kg (opcional)">
      </div>
      <button type="submit" class="add-btn">Adicionar 🏋️</button>
    </form>
  </main>

</div>

        {name:'Cadeira Flexora',video:'https://cdnh.sistemasca.com/arquivos/exercicios/213.gif'},
        {name:'Step Box',video:'https://cdnh.sistemasca.com/arquivos/exercicios/400.gif'},
        {name:'Abdução no Apolete',video:'https://cdnh.sistemasca.com/arquivos/exercicios/204.gif'},
        {name:'Elevação de Panturrilha em Pé',video:'https://cdnh.sistemasca.com/arquivos/exercicios/244.gif'},
        {name:'Mesa Flexora',video:'https://cdnh.sistemasca.com/arquivos/exercicios/194.gif'}
      ]
    },
    qui: {
      name:'Quinta', group:'Abdômen e Core',
      exercises:[
        {name:'Abdominal Bicicleta',video:'https://cdnh.sistemasca.com/arquivos/exercicios/268.gif'},
        {name:'Heel Touch',video:'https://gymvisual.com/img/p/1/4/6/6/0/14660.gif'},
        {name:'Abdominal com Elevação de Perna',video:'https://cdnh.sistemasca.com/arquivos/exercicios/251.gif'},
        {name:'Mountain Climber',video:'https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyN25uZW5iaTVpOWh3MDFjOXd3amZjeDhhb2g3MXZvNTFhMmU1bWN2MCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bWYc47O3jSef6/200w.gif'},
        {name:'Prancha',video:'https://grandeatleta.com.br/wp-content/uploads/2018/06/Prancha-abdominal-Ponte-ventral.gif'},
        {name:'Prancha com Toque no Ombro',video:'https://thumbs.dreamstime.com/z/mulher-fazendo-torneira-no-ombro-ilustra%C3%A7%C3%A3o-de-vetor-plano-isolada-em-fundo-branco-223249517.jpg'},
        {name:'Abdominal Infra',video:'https://cdnh.sistemasca.com/arquivos/exercicios/102.gif'},
        {name:'Prancha Lateral',video:'https://www.hipertrofia.org/blog/wp-content/uploads/2020/11/execucao-prancha-lateral.jpg'},
        {name:'Abdominal Amplitude Máxima',video:'https://cdnh.sistemasca.com/arquivos/exercicios/100.gif'}
      ]
    },
    sex: {
      name:'Sexta', group:'Peito + Ombro + Tríceps + Trapézio',
      exercises:[
        {name:'Crucifixo Articulado inclinado',video:'https://cdnh.sistemasca.com/arquivos/exercicios/803.gif'},
        {name:'Supino Reto Máquina',video:'https://cdnh.sistemasca.com/arquivos/exercicios/749.gif'},
        {name:'Elevação Lateral',video:'https://cdnh.sistemasca.com/arquivos/exercicios/158.gif'},
        {name:'Desenvolvimento Articulado',video:'https://cdnh.sistemasca.com/arquivos/exercicios/146.gif'},
        {name:'Remada Alta',video:'https://cdnh.sistemasca.com/arquivos/exercicios/161.gif'},
        {name:'Encolhimento de Ombros com Halteres',video:'https://treinomestre.com.br/wp-content/uploads/2016/01/encolhimento-de-ombros-com-halter.gif'},
        {name:'Face Pull',video:'https://cdnh.sistemasca.com/arquivos/exercicios/451.gif'},
        {name:'Mobilidade de Ombro',video:'https://cdnh.sistemasca.com/arquivos/exercicios/726.gif'},
        {name:'Tríceps Pulley',video:'https://cdnh.sistemasca.com/arquivos/exercicios/226.gif'},
        {name:'Tríceps Corda no Cross Over',video:'https://cdnh.sistemasca.com/arquivos/exercicios/230.gif'},
        {name:'Tríceps Francês',video:'https://cdnh.sistemasca.com/arquivos/exercicios/219.gif'},
        {name:'Tríceps Testa',video:''}
      ]
    }
  };

  var state=null, curDay=null, editId=null, expandId=null, previews={}, saveT=null;

  function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function ytLink(n){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' execução exercício'); }

  function defState(){
    var d={};
    DAYS.forEach(function(k){
      var df=DEFAULTS[k];
      d[k]={name:df.name,group:df.group,exercises:df.exercises.map(function(it){
        return {id:uid(),name:it.name,sets:'3',reps:'12',weight:'',video:it.video||ytLink(it.name),done:false};
      })};
    });
    return {days:d};
  }

  function save(){
    var dot=document.getElementById('save-dot'), txt=document.getElementById('save-text');
    dot.className='dot saving'; txt.textContent='Salvando...';
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      try{
        var j=JSON.stringify(state);
        localStorage.setItem(SK,j);
        localStorage.setItem(BK,j);
      }catch(e){}
      dot.className='dot'; txt.textContent='Salvo ✓';
      setTimeout(function(){ txt.textContent='Dados salvos'; },1500);
    },300);
  }

  function load(){
    try{
      var d=localStorage.getItem(SK);
      if(d){ state=JSON.parse(d); }
      else { state=defState(); }
    }catch(e){ state=defState(); }
  }

  /* ═══════════════════════════════════════════
     🛠️ CORREÇÃO iPHONE #3: Reinicia GIFs
     quando eles aparecem na tela
     ═══════════════════════════════════════════ */
  function fixGifs(){
    var imgs=document.querySelectorAll('.media-image');
    imgs.forEach(function(img){
      if(img.src && img.src.indexOf('.gif')>-1){
        // Remove lazy loading (trava GIFs no iOS)
        img.removeAttribute('loading');
        img.setAttribute('decoding','async');
        // Força restart do GIF
        var s=img.src;
        img.src='';
        img.src=s;
      }
    });
  }

  /* ═══════════════════════════════════════════
     🛠️ CORREÇÃO iPHONE #4: Observer que
     "acorda" GIFs quando entram na viewport
     ═══════════════════════════════════════════ */
  var gifObserver = null;
  if('IntersectionObserver' in window){
    gifObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var img=en.target;
          if(img.dataset.gifSrc){
            img.src=img.dataset.gifSrc;
          }
        }
      });
    },{threshold:0.1});
  }

  function renderHome(){
    var g=document.getElementById('day-grid');
    g.innerHTML='';
    DAYS.forEach(function(k,i){
      var day=state.days[k];
      if(!day) return;
      var total=day.exercises?day.exercises.length:0;
      var done=day.exercises?day.exercises.filter(function(e){return e.done;}).length:0;
      var pct=total?Math.round(done/total*100):0;

      var b=document.createElement('button');
      b.className='day-card';
      b.style.webkitAnimation='fadeUp 0.4s ease '+(i*0.08)+'s both';
      b.style.animation='fadeUp 0.4s ease '+(i*0.08)+'s both';
      b.innerHTML=
        '<span class="day-badge">'+(day.name?day.name.slice(0,3).toUpperCase():k.toUpperCase())+'</span>'+
        '<span class="day-info">'+
          '<span class="name">'+esc(day.name)+'</span>'+
          '<span class="group">'+esc(day.group||'')+'</span>'+
          '<span class="count">'+done+'/'+total+' concluídos · '+pct+'%</span>'+
        '</span>'+
        '<span class="day-arrow">›</span>';
      b.addEventListener('click',function(){ goDay(k); });
      g.appendChild(b);
    });
  }

  function renderDay(){
    var day=state.days[curDay];
    if(!day) return;

    document.getElementById('day-title').textContent=day.name||curDay;
    document.getElementById('group-display').textContent=day.group||'';
    document.getElementById('group-input').value=day.group||'';

    var total=day.exercises?day.exercises.length:0;
    var done=day.exercises?day.exercises.filter(function(e){return e.done;}).length:0;
    var pct=total?Math.round(done/total*100):0;

    document.getElementById('progress-text').textContent=done+' / '+total+' concluídos';
    document.getElementById('progress-pct').textContent=pct+'%';
    document.getElementById('progress-fill').style.width=pct+'%';

    var list=document.getElementById('ex-list');
    list.innerHTML='';

    if(!total){
      list.innerHTML='<div class="empty-state">Nenhum exercício ainda. Adicione abaixo! 👇</div>';
      return;
    }

    day.exercises.forEach(function(ex){
      var row=document.createElement('div');
      row.className='ex-row'+(ex.done?' done':'');

      if(ex.id===editId){
        row.classList.add('editing');
        row.innerHTML=
          '<span class="ex-name">'+esc(ex.name)+'</span>'+
          '<div class="edit-fields">'+
            '<input class="edit-input" data-f="sets" data-id="'+ex.id+'" value="'+esc(ex.sets)+'" placeholder="séries">'+
            '<input class="edit-input" data-f="reps" data-id="'+ex.id+'" value="'+esc(ex.reps)+'" placeholder="reps">'+
            '<input class="edit-input" data-f="weight" data-id="'+ex.id+'" value="'+esc(ex.weight)+'" placeholder="kg">'+
          '</div>'+
          '<input class="edit-video-input" data-f="video" data-id="'+ex.id+'" value="'+esc(ex.video)+'" placeholder="link do vídeo/gif">'+
          '<div class="edit-file">'+
            '<label>📁 ou carregar arquivo (mp4, gif, imagem)</label>'+
            '<input type="file" class="file-inp" data-id="'+ex.id+'" accept="video/*,image/*">'+
            (previews[ex.id]?'<div class="local-badge">✅ arquivo carregado · <button class="local-remove" data-id="'+ex.id+'">remover</button></div>':'')+
          '</div>'+
          '<p class="edit-hint">Arquivo do dispositivo só funciona nesta sessão. Para permanente, use link (YouTube, Drive).</p>'+
          '<button class="edit-save" data-id="'+ex.id+'">✓ Salvar</button>';
        list.appendChild(row);
      } else {
        var parts=[];
        if(ex.sets) parts.push(ex.sets+'x');
        if(ex.reps) parts.push(ex.reps);
        if(ex.weight) parts.push(ex.weight+'kg');
        var meta=parts.join(' ');
        var hasVid=!!ex.video||!!previews[ex.id];
        var isExp=ex.id===expandId;

        row.innerHTML=
          '<button class="ex-check'+(ex.done?' checked':'')+'" data-id="'+ex.id+'">'+(ex.done?'✓':'')+'</button>'+
          '<span class="ex-name">'+esc(ex.name)+'</span>'+
          (hasVid?'<button class="ex-play'+(isExp?' active':'')+'" data-id="'+ex.id+'">▶</button>':'')+
          '<button class="ex-meta'+(meta?'':' empty')+'" data-id="'+ex.id+'">'+(meta||'definir')+'</button>'+
          '<button class="ex-del" data-id="'+ex.id+'">×</button>';
        list.appendChild(row);

        if(isExp&&hasVid){
          var p=document.createElement('div');
          p.className='vid-panel';
          var emb=previews[ex.id]?localEmbed(previews[ex.id]):mediaEmbed(ex.video);
          p.innerHTML=
            '<div class="vid-head"><span class="vid-title">🎬 Demonstração</span>'+
            '<button class="vid-close" data-id="'+ex.id+'">✕ fechar</button></div>'+emb;
          list.appendChild(p);

          /* 🛠️ CORREÇÃO iPHONE #5: Reinicia GIF depois de renderizar */
          setTimeout(fixGifs, 100);
          setTimeout(fixGifs, 500);
          setTimeout(fixGifs, 1500);
        }
      }
    });
  }

  function mediaEmbed(url){
    if(!url) return '';
    var yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{6,})/);
    if(yt) return '<div class="media-embed"><iframe src="https://www.youtube.com/embed/'+yt[1]+'" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>';
    var dr=url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9_-]+)/);
    if(dr) return '<div class="media-embed"><iframe src="https://drive.google.com/file/d/'+dr[1]+'/preview"></iframe></div>';
    if(/\.(gif|png|jpe?g|webp|avif)(\?.*)?$/i.test(url)){
      /* 🛠️ SEM loading="lazy" — isso TRAVA GIFs no iPhone! */
      return '<img class="media-image" src="'+esc(url)+'" alt="Exercício" decoding="async">';
    }
    if(/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url)){
      return '<div class="media-embed"><video src="'+esc(url)+'" controls playsinline loop muted autoplay></video></div>';
    }
    if(/youtube\.com\/results/.test(url)){
      return '<a class="media-link" href="'+esc(url)+'" target="_blank">🔍 Ver no YouTube ↗</a>';
    }
    return '<a class="media-link" href="'+esc(url)+'" target="_blank">Abrir link ↗</a>';
  }

  function localEmbed(pv){
    if(pv.type==='image') return '<img class="media-image" src="'+pv.url+'" alt="Exercício">';
    return '<div class="media-embed"><video controls playsinline autoplay muted loop><source src="'+pv.url+'" type="'+esc(pv.mime||'video/mp4')+'"></video></div>';
  }

  function goDay(k){
    curDay=k;
    document.getElementById('home-view').hidden=true;
    document.getElementById('day-view').hidden=false;
    document.getElementById('group-input').hidden=true;
    document.getElementById('group-display').hidden=false;
    renderDay();
    window.scrollTo(0,0);
  }

  function goHome(){
    curDay=null;
    document.getElementById('day-view').hidden=true;
    document.getElementById('home-view').hidden=false;
    renderHome();
    window.scrollTo(0,0);
  }

  /* ── Events ── */
  document.getElementById('back-btn').addEventListener('click',goHome);

  document.getElementById('backup-btn').addEventListener('click',function(){
    try{ localStorage.setItem(BK,JSON.stringify(state)); alert('✅ Backup criado!'); }
    catch(e){ alert('❌ Erro'); }
  });

  document.getElementById('restore-btn').addEventListener('click',function(){
    try{
      var b=localStorage.getItem(BK);
      if(!b){ alert('❌ Sem backup'); return; }
      var p=JSON.parse(b);
      if(!p.days){ alert('❌ Inválido'); return; }
      if(!confirm('⚠️ Substituir tudo pelo backup?')) return;
      state=p; save(); renderHome();
      alert('✅ Restaurado!');
    }catch(e){ alert('❌ Erro'); }
  });

  document.getElementById('reset-btn').addEventListener('click',function(){
    if(!confirm('⚠️ Apagar TUDO e voltar ao padrão?')) return;
    if(!confirm('Última chance! Continuar?')) return;
    state=defState(); save(); renderHome();
  });

  document.getElementById('group-edit-btn').addEventListener('click',function(){
    var i=document.getElementById('group-input'), d=document.getElementById('group-display');
    if(i.hidden){ i.hidden=false; d.hidden=true; i.focus(); i.select(); }
    else commitGroup();
  });
  document.getElementById('group-input').addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); commitGroup(); }
  });
  document.getElementById('group-input').addEventListener('blur',commitGroup);
  function commitGroup(){
    var i=document.getElementById('group-input');
    if(i.hidden) return;
    state.days[curDay].group=i.value.trim();
    save(); i.hidden=true;
    document.getElementById('group-display').hidden=false;
    renderDay();
  }

  document.getElementById('ex-list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList.contains('ex-check')){
      var ex=find(t.dataset.id);
      if(ex){ ex.done=!ex.done; save(); renderDay(); }
    } else if(t.classList.contains('ex-del')){
      var id=t.dataset.id;
      if(editId===id) editId=null;
      if(expandId===id) expandId=null;
      if(previews[id]){ URL.revokeObjectURL(previews[id].url); delete previews[id]; }
      state.days[curDay].exercises=state.days[curDay].exercises.filter(function(x){return x.id!==id;});
      save(); renderDay();
    } else if(t.classList.contains('ex-meta')){
      editId=t.dataset.id; renderDay();
      var fi=document.querySelector('.edit-input[data-f="sets"]');
      if(fi){ fi.focus(); fi.select(); }
    } else if(t.classList.contains('edit-save')){
      commitEdit(t.dataset.id);
    } else if(t.classList.contains('ex-play')){
      var pid=t.dataset.id;
      expandId=(expandId===pid)?null:pid;
      renderDay();
    } else if(t.classList.contains('vid-close')){
      expandId=null; renderDay();
    } else if(t.classList.contains('local-remove')){
      var rid=t.dataset.id;
      if(previews[rid]){ URL.revokeObjectURL(previews[rid].url); delete previews[rid]; }
      renderDay();
    }
  });

  document.getElementById('ex-list').addEventListener('change',function(e){
    if(e.target.classList.contains('file-inp')){
      var fid=e.target.dataset.id, f=e.target.files&&e.target.files[0];
      if(!f) return;
      if(previews[fid]) URL.revokeObjectURL(previews[fid].url);
      previews[fid]={url:URL.createObjectURL(f),type:f.type.indexOf('image/')===0?'image':'video',mime:f.type||''};
      renderDay();
    }
  });

  document.getElementById('ex-list').addEventListener('keydown',function(e){
    if(e.target.classList.contains('edit-input')&&e.key==='Enter'){
      e.preventDefault(); commitEdit(e.target.dataset.id);
    }
  });

  function find(id){
    return state.days[curDay].exercises.find(function(x){return x.id===id;});
  }

  function commitEdit(id){
    var ex=find(id); if(!ex) return;
    var s=document.querySelector('.edit-input[data-f="sets"][data-id="'+id+'"]');
    var r=document.querySelector('.edit-input[data-f="reps"][data-id="'+id+'"]');
    var w=document.querySelector('.edit-input[data-f="weight"][data-id="'+id+'"]');
    var v=document.querySelector('.edit-video-input[data-id="'+id+'"]');
    if(s) ex.sets=s.value.trim();
    if(r) ex.reps=r.value.trim();
    if(w) ex.weight=w.value.trim();
    if(v) ex.video=v.value.trim();
    editId=null; save(); renderDay();
  }

  document.getElementById('add-form').addEventListener('submit',function(e){
    e.preventDefault();
    var n=document.getElementById('inp-name').value.trim();
    if(!n) return;
    state.days[curDay].exercises.push({
      id:uid(), name:n,
      sets:document.getElementById('inp-sets').value.trim()||'3',
      reps:document.getElementById('inp-reps').value.trim()||'12',
      weight:document.getElementById('inp-weight').value.trim(),
      video:ytLink(n), done:false
    });
    save();
    document.getElementById('inp-name').value='';
    document.getElementById('inp-sets').value='';
    document.getElementById('inp-reps').value='';
    document.getElementById('inp-weight').value='';
    document.getElementById('inp-name').focus();
    renderDay();
  });

  /* ── Init ── */
  load();
  renderHome();

  window.addEventListener('beforeunload',function(){
    if(state) try{ localStorage.setItem(SK,JSON.stringify(state)); }catch(e){}
  });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'&&state)
      try{ localStorage.setItem(SK,JSON.stringify(state)); }catch(e){}
  });

  /* 🛠️ CORREÇÃO iPHONE #6: Quando volta ao app, reinicia GIFs */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){
      setTimeout(fixGifs,300);
    }
  });

})();
</script>

</body>
