<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#191613">
<title>Meu Treino da Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191613; --bg2:#211d18; --card:#26211b; --card2:#2d2720;
    --border:#3a3227; --border2:#4a4033;
    --chalk:#ece4d2; --chalk-dim:#a89d88; --chalk-faint:#6f6555;
    --rust:#c96f3f; --rust-bright:#e08a55; --rust-dim:rgba(201,111,63,.14);
    --gold:#d9a441; --moss:#8aa07a; --moss-dim:rgba(138,160,122,.14);
    --red:#c0564a;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg); color:var(--chalk);
    font-family:'Work Sans',sans-serif; min-height:100vh;
    overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
  }
  /* fundo em camadas: luz quente + textura de "serrilhado" de academia */
  body{
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -10%, rgba(201,111,63,.10), transparent 60%),
      radial-gradient(ellipse 70% 45% at 90% 105%, rgba(217,164,65,.05), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px);
    background-attachment:fixed;
  }
  .wrap{max-width:620px;margin:0 auto;padding:28px 16px 110px}

  /* ── animações base (com prefixo p/ iOS) ── */
  @-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(16px);transform:translateY(16px)}to{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @-webkit-keyframes spin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @-webkit-keyframes pop{0%{-webkit-transform:scale(.6);transform:scale(.6)}70%{-webkit-transform:scale(1.15);transform:scale(1.15)}100%{-webkit-transform:scale(1);transform:scale(1)}}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @-webkit-keyframes shimmer{0%{-webkit-transform:translateX(-100%);transform:translateX(-100%)}100%{-webkit-transform:translateX(220%);transform:translateX(220%)}}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
  @-webkit-keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ═════════ HEADER — barra de agachamento ═════════ */
  .top{text-align:center;margin-bottom:26px;-webkit-animation:rise .5s ease both;animation:rise .5s ease both}
  .barbell{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:14px}
  .barbell .bar{width:70px;height:5px;border-radius:3px;background:linear-gradient(180deg,#8a8478,#5b564c)}
  .barbell .plate{border-radius:50%;background:radial-gradient(circle at 35% 30%,#6b645a,#2f2a24 75%);border:2px solid #55503f}
  .barbell .p1{width:34px;height:34px}
  .barbell .p2{width:26px;height:26px}
  .barbell .p3{width:18px;height:18px}
  .top h1{
    font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:.95;letter-spacing:2px;
  }
  .top h1 em{font-style:normal;color:var(--rust-bright)}
  .top .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--chalk-faint);margin-top:8px}

  /* ═════════ STATUS SAVE ═════════ */
  .savebar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--bg2);border:1px solid var(--border);border-radius:9px;
    padding:8px 12px;margin-bottom:22px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--moss);
  }
  .savebar .dot{width:7px;height:7px;border-radius:50%;background:var(--moss);flex-shrink:0}
  .savebar .dot.saving{background:var(--rust-bright);-webkit-animation:blink .6s ease infinite;animation:blink .6s ease infinite}
  .savebar .spacer{flex:1}
  .chip-btn{
    background:none;border:1px solid var(--border2);color:var(--chalk-dim);
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 10px;border-radius:6px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;
  }
  .chip-btn:active{border-color:var(--rust);color:var(--rust-bright);background:var(--rust-dim)}

  /* ═════════ CARDS DE DIA (anilhas) ═════════ */
  .days{display:flex;flex-direction:column;gap:10px}
  .day-card{
    display:flex;align-items:center;gap:15px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px;cursor:pointer;color:inherit;font:inherit;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .18s, background .18s, transform .12s;
    -webkit-animation:rise .45s ease both;animation:rise .45s ease both;
  }
  .day-card:active{transform:scale(.98);border-color:var(--rust);background:var(--card2)}
  .plate-badge{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;position:relative;
    background:radial-gradient(circle at 35% 30%,#7a7264,#332d25 72%);
    border:3px solid #5a5443;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;color:var(--chalk);
    box-shadow:inset 0 0 0 5px rgba(0,0,0,.28), 0 3px 10px rgba(0,0,0,.35);
  }
  .plate-badge::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
  .day-card.full .plate-badge{border-color:var(--moss);box-shadow:inset 0 0 0 5px rgba(0,0,0,.28),0 0 14px var(--moss-dim)}
  .day-info{flex:1;min-width:0}
  .day-info .nm{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:1px;line-height:1}
  .day-info .gp{font-size:12px;color:var(--chalk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .day-info .ct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--chalk-faint);margin-top:4px}
  .day-info .ct b{color:var(--gold);font-weight:600}
  .day-arrow{color:var(--chalk-faint);font-size:20px;flex-shrink:0;transition:transform .18s}
  .day-card:active .day-arrow{transform:translateX(3px);color:var(--rust-bright)}

  .reset-btn{
    display:block;margin:26px auto 0;background:none;border:1px dashed var(--border2);
    color:var(--chalk-faint);font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:9px 18px;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .reset-btn:active{border-color:var(--red);color:var(--red)}

  /* ═════════ VISÃO DO DIA ═════════ */
  .back-btn{
    display:inline-flex;align-items:center;gap:7px;background:none;border:none;
    color:var(--rust-bright);font-family:'JetBrains Mono',monospace;font-size:13px;
    cursor:pointer;padding:8px 0;margin-bottom:14px;-webkit-tap-highlight-color:transparent;
  }
  .day-title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:1px;line-height:1}
  .group-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0 18px}
  .group-label{font-size:14px;color:var(--chalk-dim)}
  .group-input{
    background:var(--bg2);border:1px solid var(--border2);color:var(--chalk);
    font-size:14px;font-family:inherit;padding:6px 10px;border-radius:8px;width:210px;
  }
  .icon-btn{background:none;border:none;color:var(--chalk-faint);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent}
  .icon-btn:active{color:var(--rust-bright)}

  /* progresso */
  .prog{margin-bottom:20px}
  .prog .lbl{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--chalk-dim);margin-bottom:7px}
  .prog .lbl b{color:var(--gold)}
  .track{height:7px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden;position:relative}
  .fill{
    height:100%;width:0;border-radius:4px;position:relative;overflow:hidden;
    background:linear-gradient(90deg,var(--rust),var(--gold));
    transition:width .5s cubic-bezier(.2,.8,.3,1);
  }
  .fill::after{
    content:"";position:absolute;top:0;bottom:0;width:45%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
    -webkit-animation:shimmer 2.2s ease infinite;animation:shimmer 2.2s ease infinite;
  }
  .done-banner{
    display:none;align-items:center;gap:8px;margin-bottom:16px;
    background:var(--moss-dim);border:1px solid var(--moss);border-radius:9px;
    padding:10px 14px;font-size:13px;font-weight:600;color:var(--moss);
  }
  .done-banner.show{display:flex;-webkit-animation:pop .4s ease both;animation:pop .4s ease both}

  /* ═════════ EXERCÍCIOS ═════════ */
  .exlist{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .ex-row{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 14px;transition:opacity .2s,border-color .2s,background .2s;
  }
  .ex-row.done{opacity:.55;border-color:var(--moss);background:var(--moss-dim)}
  .ex-check{
    width:25px;height:25px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--chalk-faint);background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#10240f;font-size:13px;font-weight:700;padding:0;
    -webkit-tap-highlight-color:transparent;transition:all .15s;
  }
  .ex-check.checked{border-color:var(--moss);background:var(--moss);-webkit-animation:pop .3s ease;animation:pop .3s ease}
  .ex-name{flex:1;min-width:0;font-size:14px;font-weight:500}
  .ex-row.done .ex-name{text-decoration:line-through;color:var(--chalk-dim)}
  .ex-meta{
    font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;flex-shrink:0;
    color:var(--rust-bright);background:var(--rust-dim);border:none;
    padding:4px 9px;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .ex-meta.empty{color:var(--chalk-faint);background:var(--bg2);font-style:italic}
  .ex-play{
    width:29px;height:29px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--rust);background:none;color:var(--rust-bright);
    display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:all .15s;padding-left:2px;
  }
  .ex-play:active,.ex-play.on{background:var(--rust);color:#fff}
  .ex-del{background:none;border:none;color:var(--chalk-faint);font-size:18px;line-height:1;cursor:pointer;padding:2px 5px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
  .ex-del:active{color:var(--red)}

  /* ═════════ PAINEL DE DEMONSTRAÇÃO (o coração do fix) ═════════ */
  .vid-panel{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin:-3px 0 5px;-webkit-animation:rise .3s ease both;animation:rise .3s ease both;
  }
  .vid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .vid-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--chalk-faint)}
  .vid-actions{display:flex;gap:6px}
  .vid-btn{
    background:var(--bg2);border:1px solid var(--border2);color:var(--chalk-dim);
    font-size:12px;width:28px;height:26px;border-radius:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
  }
  .vid-btn:active{color:var(--rust-bright);border-color:var(--rust)}

  .demo-box{
    position:relative;width:100%;aspect-ratio:16/9;background:#0d0b08;
    border-radius:9px;overflow:hidden;
    /* GPU sempre ligada p/ mídia */
    -webkit-transform:translateZ(0);transform:translateZ(0);
  }
  .demo-vid,.demo-img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;display:block;
    -webkit-transform:translateZ(0);transform:translateZ(0);
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
  }
  .demo-img{cursor:pointer}
  .demo-load{
    position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;gap:11px;
    align-items:center;justify-content:center;background:#0d0b08;
    color:var(--chalk-dim);font-family:'JetBrains Mono',monospace;font-size:11px;text-align:center;padding:0 16px;
  }
  .spin{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--border2);border-top-color:var(--rust-bright);
    -webkit-animation:spin .8s linear infinite;animation:spin .8s linear infinite;
  }
  .ios-hint{
    margin-top:9px;font-size:11px;line-height:1.5;color:var(--chalk-faint);
  }
  .ios-hint b{color:var(--gold)}
  .media-link{
    display:inline-block;color:var(--rust-bright);font-family:'JetBrains Mono',monospace;font-size:13px;
    padding:14px 0;
  }
  .media-embed{position:relative;width:100%;aspect-ratio:16/9;background:#0d0b08;border-radius:9px;overflow:hidden}
  .media-embed iframe,.media-embed video{width:100%;height:100%;border:0;display:block}
  .still-img{width:100%;max-height:340px;object-fit:contain;border-radius:9px;background:#0d0b08;display:block}

  /* ═════════ EDIÇÃO ═════════ */
  .ex-row.editing{flex-direction:column;align-items:stretch;gap:9px}
  .edit-fields{display:flex;gap:7px;flex-wrap:wrap}
  .edit-input{
    flex:1;min-width:58px;background:var(--bg2);border:1px solid var(--border2);color:var(--chalk);
    font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px;border-radius:8px;
  }
  .edit-input:focus{outline:1px solid var(--rust);border-color:var(--rust)}
  .edit-video{
    width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--chalk);
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:9px;border-radius:8px;
  }
  .edit-video:focus{outline:1px solid var(--rust)}
  .edit-file label{font-size:11px;color:var(--chalk-dim);display:block;margin-bottom:4px}
  .edit-file input[type=file]{font-size:11px;color:var(--chalk-dim);max-width:100%}
  .local-badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--moss);margin-top:5px}
  .local-remove{background:none;border:none;color:var(--chalk-faint);font-size:10px;text-decoration:underline;cursor:pointer}
  .edit-hint{font-size:10px;color:var(--chalk-faint);line-height:1.5}
  .edit-save{
    align-self:flex-end;background:var(--rust);color:#fff;border:none;
    font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 18px;border-radius:8px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .edit-save:active{background:var(--rust-bright)}

  /* ═════════ FORM ADICIONAR ═════════ */
  .add-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .add-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-faint);margin-bottom:12px}
  .form-row{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .form-row input{
    flex:1;min-width:0;background:var(--card);border:1px solid var(--border2);color:var(--chalk);
    font-size:14px;font-family:inherit;padding:11px 12px;border-radius:8px;
  }
  .form-row input:focus{outline:1px solid var(--rust);border-color:var(--rust)}
  .form-row input::placeholder{color:var(--chalk-faint)}
  .form-row.sm input{font-size:13px;padding:9px 10px}
  .add-btn{
    width:100%;border:none;cursor:pointer;margin-top:4px;
    background:linear-gradient(135deg,var(--rust),#a8542c);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    padding:13px;border-radius:9px;-webkit-tap-highlight-color:transparent;
    box-shadow:0 5px 18px rgba(201,111,63,.28);transition:transform .12s;
  }
  .add-btn:active{transform:scale(.97)}
  .empty-state{
    border:1px dashed var(--border2);border-radius:var(--radius);padding:30px 18px;
    text-align:center;color:var(--chalk-faint);font-size:14px;margin-bottom:16px;
  }
  [hidden]{display:none!important}

  @media (max-width:420px){
    .ex-row{flex-wrap:wrap;gap:9px}
    .ex-name{order:1;flex-basis:calc(100% - 84px)}
    .ex-check{order:0}
    .ex-play{order:2}
    .ex-meta{order:3;flex-basis:100%;text-align:center}
    .ex-del{order:4;margin-left:auto}
    .edit-fields{flex-direction:column}
    .edit-input{min-width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ═══ HOME ═══ -->
  <main id="home-view">
    <div class="top">
      <div class="barbell" aria-hidden="true">
        <span class="plate p3"></span><span class="plate p2"></span><span class="plate p1"></span>
        <span class="bar"></span>
        <span class="plate p1"></span><span class="plate p2"></span><span class="plate p3"></span>
      </div>
      <h1>MEU TREINO <em>DA SEMANA</em></h1>
      <p class="sub">sem peso · sem desculpa</p>
    </div>

    <div class="savebar">
      <span class="dot" id="save-dot"></span>
      <span id="save-text">Dados salvos</span>
      <span class="spacer"></span>
      <button class="chip-btn" id="backup-btn">📥 backup</button>
      <button class="chip-btn" id="restore-btn">📤 restaurar</button>
    </div>

    <div class="days" id="day-grid"></div>
    <button class="reset-btn" id="reset-btn">↺ restaurar treino padrão</button>
  </main>

  <!-- ═══ DIA ═══ -->
  <main id="day-view" hidden>
    <button class="back-btn" id="back-btn">← semana</button>
    <h1 class="day-title" id="day-title">Segunda</h1>
    <div class="group-row">
      <span class="group-label" id="group-display"></span>
      <input class="group-input" id="group-input" hidden>
      <button class="icon-btn" id="group-edit-btn">✏️ editar grupo</button>
    </div>

    <div class="prog">
      <div class="lbl"><span id="prog-text">0 / 0 concluídos</span><b id="prog-pct">0%</b></div>
      <div class="track"><div class="fill" id="prog-fill"></div></div>
    </div>

    <div class="done-banner" id="done-banner">💪 Dia completo! Bora descansar.</div>

    <div class="exlist" id="ex-list"></div>

    <form class="add-form" id="add-form">
      <p class="add-title">＋ adicionar exercício</p>
      <div class="form-row"><input type="text" id="inp-name" placeholder="Nome do exercício" required></div>
      <div class="form-row sm">
        <input type="text" id="inp-sets" placeholder="Séries (3)">
        <input type="text" id="inp-reps" placeholder="Reps (12)">
        <input type="text" id="inp-weight" placeholder="Kg (opcional)">
      </div>
      <button type="submit" class="add-btn">adicionar 🏋️</button>
    </form>
  </main>

</div>

<script>
(function(){
  var SK='treino_semana_v9', BK='treino_semana_backup_v9';
  var DAYS=['seg','ter','qua','qui','sex'];

  var DEFAULTS={
    seg:{name:'Segunda',group:'Costas + Bíceps + Antebraço',exercises:[
      {name:'Puxada Alta Articulada',video:'https://cdnh.sistemasca.com/arquivos/exercicios/730.gif'},
      {name:'Pulley Frente',video:'https://cdnh.sistemasca.com/arquivos/exercicios/128.gif'},
      {name:'Remada Baixa neutra',video:'https://cdnh.sistemasca.com/arquivos/exercicios/335.gif'},
      {name:'Remada Articulada neutra',video:'https://cdnh.sistemasca.com/arquivos/exercicios/330.gif'},
      {name:'Rosca Scott',video:'https://cdnh.sistemasca.com/arquivos/exercicios/118.gif'},
      {name:'Rosca Direta com Halter',video:'https://cdnh.sistemasca.com/arquivos/exercicios/115.gif'},
      {name:'Rosca Martelo',video:'https://cdnh.sistemasca.com/arquivos/exercicios/121.gif'},
      {name:'Rosca de Punho',video:'https://treinomestre.com.br/wp-content/uploads/2024/09/flexao-de-punho-com-halteres.gif'},
      {name:'Rosca de Punho Invertida',video:'https://i.makeagif.com/media/3-05-2016/gnybhY.gif'},
      {name:'Rosca de Punho com Rolo',video:'https://cdnh.sistemasca.com/arquivos/exercicios/304.gif'}
    ]},
    ter:{name:'Terça',group:'Pegada + Antebraço + Core',exercises:[
      {name:'Barra Fixa Estática',video:'https://s3.sa-east-1.amazonaws.com/static.activodeporte.com/brasil/uploads/2018/07/02182022/barra-fixa-supinada.jpg'},

      {name:'Encolhimento de Ombros com Halteres',video:'https://treinomestre.com.br/wp-content/uploads/2016/01/encolhimento-de-ombros-com-halter.gif'},

      {name:'Tríceps Francês',video:'https://cdnh.sistemasca.com/arquivos/exercicios/219.gif'},
      {name:'Tríceps Testa',video:''}
    ]}
  };

  var state=null,curDay=null,editId=null,expandId=null,previews={},saveT=null;

  function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function ytLink(n){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' execução exercício');}
  function isGif(u){return /\.(gif)(\?.*)?$/i.test(u);}
  function isImg(u){return /\.(png|jpe?g|webp|avif)(\?.*)?$/i.test(u);}
  function isVid(u){return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u);}
  function bust(u){return u+(u.indexOf('?')>-1?'&':'?')+'_r='+Date.now();}

  function defState(){
    var d={};
    DAYS.forEach(function(k){
      var df=DEFAULTS[k];
      d[k]={name:df.name,group:df.group,exercises:df.exercises.map(function(it){
        return {id:uid(),name:it.name,sets:'3',reps:'12',weight:'',video:it.video||ytLink(it.name),done:false};
      })};
    });
    return {days:d};
  }

  function save(){
    var dot=document.getElementById('save-dot'),txt=document.getElementById('save-text');
    dot.className='dot saving';txt.textContent='salvando...';
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      try{var j=JSON.stringify(state);localStorage.setItem(SK,j);localStorage.setItem(BK,j);}catch(e){}
      dot.className='dot';txt.textContent='salvo ✓';
      setTimeout(function(){txt.textContent='Dados salvos';},1500);
    },300);
  }
  function load(){
    try{var d=localStorage.getItem(SK);state=d?JSON.parse(d):defState();}
    catch(e){state=defState();}
  }

  /* ═════════ RENDER HOME ═════════ */
  function renderHome(){
    var g=document.getElementById('day-grid');g.innerHTML='';
    DAYS.forEach(function(k,i){
      var day=state.days[k];if(!day)return;
      var total=day.exercises?day.exercises.length:0;
      var done=day.exercises?day.exercises.filter(function(e){return e.done;}).length:0;
      var pct=total?Math.round(done/total*100):0;
      var b=document.createElement('button');
      b.className='day-card'+(total&&done===total?' full':'');
      b.style.webkitAnimationDelay=(i*0.07)+'s';b.style.animationDelay=(i*0.07)+'s';
      b.innerHTML=
        '<span class="plate-badge">'+(day.name?day.name.slice(0,3).toUpperCase():k.toUpperCase())+'</span>'+
        '<span class="day-info">'+
          '<span class="nm">'+esc(day.name)+'</span>'+
          '<span class="gp">'+esc(day.group||'')+'</span>'+
          '<span class="ct"><b>'+done+'/'+total+'</b> concluídos · '+pct+'%</span>'+
        '</span><span class="day-arrow">›</span>';
      b.addEventListener('click',function(){goDay(k);});
      g.appendChild(b);
    });
  }

  /* ═════════ RENDER DIA ═════════ */
  function renderDay(){
    var day=state.days[curDay];if(!day)return;
    document.getElementById('day-title').textContent=day.name||curDay;
    document.getElementById('group-display').textContent=day.group||'';
    document.getElementById('group-input').value=day.group||'';

    var total=day.exercises?day.exercises.length:0;
    var done=day.exercises?day.exercises.filter(function(e){return e.done;}).length:0;
    var pct=total?Math.round(done/total*100):0;
    document.getElementById('prog-text').textContent=done+' / '+total+' concluídos';
    document.getElementById('prog-pct').textContent=pct+'%';
    document.getElementById('prog-fill').style.width=pct+'%';
    var bn=document.getElementById('done-banner');
    bn.className='done-banner'+(total&&done===total?' show':'');

    var list=document.getElementById('ex-list');list.innerHTML='';
    if(!total){list.innerHTML='<div class="empty-state">Nenhum exercício ainda. Adicione o primeiro! 👇</div>';return;}

    day.exercises.forEach(function(ex){
      var row=document.createElement('div');
      row.className='ex-row'+(ex.done?' done':'');

      if(ex.id===editId){
        row.classList.add('editing');
        row.innerHTML=
          '<span class="ex-name">'+esc(ex.name)+'</span>'+
          '<div class="edit-fields">'+
            '<input class="edit-input" data-f="sets" data-id="'+ex.id+'" value="'+esc(ex.sets)+'" placeholder="séries">'+
            '<input class="edit-input" data-f="reps" data-id="'+ex.id+'" value="'+esc(ex.reps)+'" placeholder="reps">'+
            '<input class="edit-input" data-f="weight" data-id="'+ex.id+'" value="'+esc(ex.weight)+'" placeholder="kg">'+
          '</div>'+
          '<input class="edit-video" data-f="video" data-id="'+ex.id+'" value="'+esc(ex.video)+'" placeholder="link do vídeo / gif">'+
          '<div class="edit-file">'+
            '<label>📁 ou carregar do dispositivo (mp4, gif, imagem)</label>'+
            '<input type="file" class="file-inp" data-id="'+ex.id+'" accept="video/*,image/*">'+
            (previews[ex.id]?'<div class="local-badge">✅ arquivo carregado · <button type="button" class="local-remove" data-id="'+ex.id+'">remover</button></div>':'')+
          '</div>'+
          '<p class="edit-hint">Arquivo do dispositivo vale só nesta sessão. Para permanente, use link (YouTube/Drive).</p>'+
          '<button class="edit-save" data-id="'+ex.id+'">✓ salvar</button>';
        list.appendChild(row);
      } else {
        var parts=[];
        if(ex.sets)parts.push(ex.sets+'x');
        if(ex.reps)parts.push(ex.reps);
        if(ex.weight)parts.push(ex.weight+'kg');
        var meta=parts.join(' ');
        var hasVid=!!ex.video||!!previews[ex.id];
        var isExp=ex.id===expandId;
        row.innerHTML=
          '<button class="ex-check'+(ex.done?' checked':'')+'" data-id="'+ex.id+'" aria-label="concluir">'+(ex.done?'✓':'')+'</button>'+
          '<span class="ex-name">'+esc(ex.name)+'</span>'+
          (hasVid?'<button class="ex-play'+(isExp?' on':'')+'" data-id="'+ex.id+'" aria-label="demonstração">▶</button>':'')+
          '<button class="ex-meta'+(meta?'':' empty')+'" data-id="'+ex.id+'">'+(meta||'definir')+'</button>'+
          '<button class="ex-del" data-id="'+ex.id+'" aria-label="remover">×</button>';
        list.appendChild(row);

        if(isExp&&hasVid){
          var p=document.createElement('div');p.className='vid-panel';
          var emb=previews[ex.id]?localEmbed(previews[ex.id]):mediaEmbed(ex.video,ex.name);
          p.innerHTML=
            '<div class="vid-head"><span class="vid-title">🎬 demonstração</span>'+
            '<span class="vid-actions">'+
              '<button class="vid-btn demo-restart" data-id="'+ex.id+'" aria-label="reiniciar">🔄</button>'+
              '<button class="vid-btn vid-close" data-id="'+ex.id+'" aria-label="fechar">✕</button>'+
            '</span></div>'+emb;
          list.appendChild(p);
          wireDemo(p,ex.name);
        }
      }
    });
  }

  /* ═════════ MÍDIA — FIX iPHONE EM CASCATA ═════════
     1) GIF → tenta VÍDEO mp4 (roda no hardware, nunca trava)
     2) falhou → GIF direto (no-referrer + cache-bust)
     3) falhou → link do YouTube                          */
  function mediaEmbed(url,name){
    if(!url)return '';
    var yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{6,})/);
    if(yt)return '<div class="media-embed"><iframe src="https://www.youtube.com/embed/'+yt[1]+'" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>';
    var dr=url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9_-]+)/);
    if(dr)return '<div class="media-embed"><iframe src="https://drive.google.com/file/d/'+dr[1]+'/preview"></iframe></div>';

    if(isGif(url)){
      var mp4='https://res.cloudinary.com/demo/video/fetch/f_mp4,q_auto/'+encodeURIComponent(url);
      return '<div class="demo-box" data-gif="'+esc(url)+'">'+
        '<div class="demo-load"><span class="spin"></span><span>preparando demonstração…</span></div>'+
        '<video class="demo-vid" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture>'+
          '<source src="'+mp4+'" type="video/mp4">'+
        '</video>'+
        '<img class="demo-img" alt="Demonstração do exercício" referrerpolicy="no-referrer" hidden>'+
      '</div>'+
      '<p class="ios-hint">Se travar no iPhone: toque no 🔄 acima · e veja se o <b>Modo de Economia de Energia</b> está DESLIGADO (Ajustes → Bateria).</p>';
    }
    if(isImg(url))return '<img class="still-img" src="'+esc(url)+'" alt="Demonstração" referrerpolicy="no-referrer">';
    if(isVid(url))return '<div class="media-embed"><video src="'+esc(url)+'" controls playsinline loop muted autoplay></video></div>';
    if(/youtube\.com\/results/.test(url))return '<a class="media-link" href="'+esc(url)+'" target="_blank" rel="noopener">🔍 Ver no YouTube ↗</a>';
    return '<a class="media-link" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir link ↗</a>';
  }

  function localEmbed(pv){
    if(pv.type==='image')return '<img class="still-img" src="'+pv.url+'" alt="Demonstração">';
    return '<div class="media-embed"><video controls playsinline autoplay muted loop><source src="'+pv.url+'" type="'+esc(pv.mime||'video/mp4')+'"></video></div>';
  }

  /* gerencia a cascata vídeo→gif→youtube */
  function wireDemo(panel,name){
    var box=panel.querySelector('.demo-box');if(!box)return;
    var gifUrl=box.getAttribute('data-gif');
    var vid=box.querySelector('.demo-vid');
    var img=box.querySelector('.demo-img');
    var load=box.querySelector('.demo-load');
    var fell=false;

    function toGif(){
      if(fell)return;fell=true;
      if(vid&&vid.parentNode)vid.parentNode.removeChild(vid);
      img.hidden=false;
      img.src=bust(gifUrl);
      img.onload=function(){if(load)load.hidden=true;};
      img.onerror=function(){
        box.innerHTML='<a class="media-link" href="'+ytLink(name)+'" target="_blank" rel="noopener">🔍 Ver demonstração no YouTube ↗</a>';
      };
      setTimeout(function(){if(load)load.hidden=true;},5000);
    }

    if(vid){
      var src=vid.querySelector('source');
      src.addEventListener('error',toGif);
      vid.addEventListener('error',toGif);
      vid.addEventListener('loadeddata',function(){
        if(load)load.hidden=true;
        vid.play().catch(function(){});
      });
      /* se em 8s não carregou nada, cai pro GIF */
      setTimeout(function(){if(!fell&&vid.readyState===0)toGif();},8000);
    }

    /* toque na imagem = força reinício do GIF */
    img.addEventListener('click',function(){img.src=bust(gifUrl);});

    /* botão 🔄 */
    var rst=panel.querySelector('.demo-restart');
    if(rst)rst.addEventListener('click',function(){
      if(!fell&&vid&&vid.readyState>=2){vid.currentTime=0;vid.play().catch(function(){});}
      else toGif();
    });
  }

  /* ═════════ NAVEGAÇÃO ═════════ */
  function goDay(k){
    curDay=k;
    document.getElementById('home-view').hidden=true;
    document.getElementById('day-view').hidden=false;
    document.getElementById('group-input').hidden=true;
    document.getElementById('group-display').hidden=false;
    renderDay();window.scrollTo(0,0);
  }
  function goHome(){
    curDay=null;
    document.getElementById('day-view').hidden=true;
    document.getElementById('home-view').hidden=false;
    renderHome();window.scrollTo(0,0);
  }
  function find(id){return state.days[curDay].exercises.find(function(x){return x.id===id;});}

  /* ═════════ EVENTOS ═════════ */
  document.getElementById('back-btn').addEventListener('click',goHome);

  document.getElementById('backup-btn').addEventListener('click',function(){
    try{localStorage.setItem(BK,JSON.stringify(state));alert('✅ Backup criado!');}catch(e){alert('❌ Erro');}
  });
  document.getElementById('restore-btn').addEventListener('click',function(){
    try{
      var b=localStorage.getItem(BK);
      if(!b){alert('❌ Nenhum backup.');return;}
      var p=JSON.parse(b);
      if(!p.days){alert('❌ Backup inválido.');return;}
      if(!confirm('⚠️ Substituir TUDO pelo backup?'))return;
      state=p;save();renderHome();alert('✅ Restaurado!');
    }catch(e){alert('❌ Erro');}
  });
  document.getElementById('reset-btn').addEventListener('click',function(){
    if(!confirm('⚠️ Apagar TUDO e voltar ao treino padrão?'))return;
    if(!confirm('Última chance! Continuar?'))return;
    state=defState();save();renderHome();
  });

  document.getElementById('group-edit-btn').addEventListener('click',function(){
    var i=document.getElementById('group-input'),d=document.getElementById('group-display');
    if(i.hidden){i.hidden=false;d.hidden=true;i.focus();i.select();}else commitGroup();
  });
  document.getElementById('group-input').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commitGroup();}});
  document.getElementById('group-input').addEventListener('blur',commitGroup);
  function commitGroup(){
    var i=document.getElementById('group-input');if(i.hidden)return;
    state.days[curDay].group=i.value.trim();save();
    i.hidden=true;document.getElementById('group-display').hidden=false;renderDay();
  }

  document.getElementById('ex-list').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList.contains('ex-check')){
      var ex=find(t.getAttribute('data-id'));
      if(ex){ex.done=!ex.done;save();renderDay();}
    }else if(t.classList.contains('ex-del')){
      var id=t.getAttribute('data-id');
      if(editId===id)editId=null;
      if(expandId===id)expandId=null;
      if(previews[id]){URL.revokeObjectURL(previews[id].url);delete previews[id];}
      state.days[curDay].exercises=state.days[curDay].exercises.filter(function(x){return x.id!==id;});
      save();renderDay();
    }else if(t.classList.contains('ex-meta')){
      editId=t.getAttribute('data-id');renderDay();
      var fi=document.querySelector('.edit-input[data-f="sets"]');
      if(fi){fi.focus();fi.select();}
    }else if(t.classList.contains('edit-save')){
      commitEdit(t.getAttribute('data-id'));
    }else if(t.classList.contains('ex-play')){
      var pid=t.getAttribute('data-id');
      expandId=(expandId===pid)?null:pid;renderDay();
    }else if(t.classList.contains('vid-close')){
      expandId=null;renderDay();
    }else if(t.classList.contains('local-remove')){
      var rid=t.getAttribute('data-id');
      if(previews[rid]){URL.revokeObjectURL(previews[rid].url);delete previews[rid];}
      renderDay();
    }
  });

  document.getElementById('ex-list').addEventListener('change',function(e){
    if(e.target.classList.contains('file-inp')){
      var fid=e.target.getAttribute('data-id'),f=e.target.files&&e.target.files[0];
      if(!f)return;
      if(previews[fid])URL.revokeObjectURL(previews[fid].url);
      previews[fid]={url:URL.createObjectURL(f),type:f.type.indexOf('image/')===0?'image':'video',mime:f.type||''};
      renderDay();
    }
  });

  document.getElementById('ex-list').addEventListener('keydown',function(e){
    if(e.target.classList.contains('edit-input')&&e.key==='Enter'){
      e.preventDefault();commitEdit(e.target.getAttribute('data-id'));
    }
  });

  function commitEdit(id){
    var ex=find(id);if(!ex)return;
    var s=document.querySelector('.edit-input[data-f="sets"][data-id="'+id+'"]');
    var r=document.querySelector('.edit-input[data-f="reps"][data-id="'+id+'"]');
    var w=document.querySelector('.edit-input[data-f="weight"][data-id="'+id+'"]');
    var v=document.querySelector('.edit-video[data-id="'+id+'"]');
    if(s)ex.sets=s.value.trim();
    if(r)ex.reps=r.value.trim();
    if(w)ex.weight=w.value.trim();
    if(v)ex.video=v.value.trim();
    editId=null;save();renderDay();
  }

  document.getElementById('add-form').addEventListener('submit',function(e){
    e.preventDefault();
    var n=document.getElementById('inp-name').value.trim();if(!n)return;
    state.days[curDay].exercises.push({
      id:uid(),name:n,
      sets:document.getElementById('inp-sets').value.trim()||'3',
      reps:document.getElementById('inp-reps').value.trim()||'12',
      weight:document.getElementById('inp-weight').value.trim(),
      video:ytLink(n),done:false
    });
    save();
    document.getElementById('inp-name').value='';
    document.getElementById('inp-sets').value='';
    document.getElementById('inp-reps').value='';
    document.getElementById('inp-weight').value='';
    document.getElementById('inp-name').focus();renderDay();
  });

  /* ═════════ INIT ═════════ */
  load();renderHome();
  function persist(){if(state)try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}}
  window.addEventListener('beforeunload',persist);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')persist();});
})();
</script>
